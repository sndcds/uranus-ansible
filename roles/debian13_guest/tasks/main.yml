---
- name: Install native Debian baseline without a distribution upgrade
  ansible.builtin.apt:
    name: >-
      {{ incus_guest_bootstrap_packages +
         ['curl', 'gnupg', 'git', 'python3-psycopg2', 'nftables',
          'logrotate', 'unattended-upgrades', 'openssl'] }}
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install time synchronization on virtual machines
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
  when: instance_type == 'virtual-machine'

- name: Enable VM time synchronization
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
  when: instance_type == 'virtual-machine'

- name: Set the application timezone
  community.general.timezone:
    name: Europe/Berlin

- name: Disable SSH password and root authentication
  ansible.builtin.template:
    src: "{{ role_path }}/../incus_instance/templates/guest-sshd.conf.j2"
    dest: /etc/ssh/sshd_config.d/00-uranus.conf
    mode: '0644'
  notify: Reload Debian guest SSH

- name: Validate sshd before reload
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false

- name: Create private guest firewall configuration
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/nft --check --file %s
  notify: Reload Debian guest firewall

- name: Enable guest firewall
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
