---
- name: Read the current SSH source before changing access rules
  ansible.builtin.command:
    argv: [printenv, SSH_CONNECTION]
  become: false
  changed_when: false
  register: host_firewall_ssh

- name: Require strict CIDRs and permit the current SSH source in its address family
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import ipaddress,json,sys;
        source=ipaddress.ip_address(sys.argv[1].split()[0]);
        v4=[ipaddress.ip_network(c,strict=True) for c in json.loads(sys.argv[2])];
        v6=[ipaddress.ip_network(c,strict=True) for c in json.loads(sys.argv[3])];
        assert v4 and all(n.version==4 and n.prefixlen>0 for n in v4);
        assert all(n.version==6 and n.prefixlen>0 for n in v6);
        assert any(source in n for n in v4+v6 if source.version==n.version)
      - "{{ host_firewall_ssh.stdout }}"
      - "{{ hetzner_management_networks | to_json }}"
      - "{{ hetzner_management_ipv6_networks | to_json }}"
  changed_when: false

- name: Create firewall configuration directory
  ansible.builtin.file:
    path: /etc/uranus
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install firewall transaction helper
  ansible.builtin.copy:
    src: firewall.py
    dest: /usr/local/sbin/uranus-firewall.py
    mode: '0700'

- name: Check for an existing unconfirmed firewall transaction
  ansible.builtin.stat:
    path: /run/uranus-firewall/pending
  register: host_firewall_pending

- name: Stop before overwriting an unconfirmed candidate
  ansible.builtin.assert:
    that: not host_firewall_pending.stat.exists
    fail_msg: Wait for the timed rollback before another firewall update.

- name: Render and parse candidate without applying it
  ansible.builtin.template:
    src: host-firewall.nft.j2
    dest: /etc/uranus/host-firewall.candidate.nft
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/nft --check --file %s
  register: host_firewall_candidate

- name: Inspect the confirmed persistent firewall
  ansible.builtin.stat:
    path: /etc/uranus/host-firewall.nft
    checksum_algorithm: sha1
  register: host_firewall_confirmed

- name: Apply changed rules with automatic rollback and a new SSH connection
  when: host_firewall_candidate.checksum != host_firewall_confirmed.stat.checksum | default('')
  block:
    - name: Arm rollback before applying the candidate
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/uranus-firewall.py, begin, "{{ host_firewall_candidate.checksum }}"]
      register: host_firewall_transaction
      changed_when: true
    - name: Close the existing SSH control connection
      ansible.builtin.meta: reset_connection
    - name: Verify a fresh authenticated SSH connection before confirmation
      ansible.builtin.wait_for_connection:
        timeout: 45
        connect_timeout: 5
        sleep: 3
      become: false
    - name: Persist only the confirmed firewall
      ansible.builtin.command:
        argv: [python3, /usr/local/sbin/uranus-firewall.py, confirm, "{{ host_firewall_transaction.stdout | trim }}"]
      changed_when: true
  rescue:
    - name: Explain timed recovery without depending on a broken SSH connection
      ansible.builtin.fail:
        msg: Firewall confirmation failed. Automatic rollback restores the previous Uranus table within 120 seconds. Reconnect and inspect.

- name: Install persistent firewall service
  ansible.builtin.copy:
    dest: /etc/systemd/system/uranus-host-firewall.service
    mode: '0644'
    content: |
      [Unit]
      Description=Confirmed Uranus host firewall
      Before=incus.service
      After=network-pre.target
      Wants=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft --file /etc/uranus/host-firewall.nft
      [Install]
      WantedBy=multi-user.target

- name: Enable confirmed firewall at boot
  ansible.builtin.systemd_service:
    name: uranus-host-firewall
    daemon_reload: true
    enabled: true
    state: started
