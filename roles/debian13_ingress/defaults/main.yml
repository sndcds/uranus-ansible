---
debian13_ingress_prepare_only: false
debian13_ingress_ip_testing: false
debian13_ingress_ip_tiles: false
# Only confirmed abusive sources belong here; request volume alone is not evidence.
# All other Nominatim clients have no request-rate limit.
debian13_ingress_nominatim_abusive_networks: []
debian13_ingress_tls_site_keys: >-
  {{ ['dev_frontend', 'dev_backend', 'prod_frontend', 'prod_backend', 'icinga', 'nominatim', 'versatiles']
     + (['dev_dashboard'] if hostvars['dev01'].dashboard_enabled | default(false) | bool else [])
     + (['documentation'] if hostvars['dev01'].documentation_enabled | default(false) | bool else [])
     + (['manual'] if hostvars['dev01'].manual_enabled | default(false) | bool else [])
     + (['plausible'] if plausible_enabled | bool else []) }}
