---
- name: Require the dedicated ingress container
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'nginx01'
      - instance_role == 'ingress'
      - instance_type == 'container'

- name: Require real public domains and explicit administration access policy
  ansible.builtin.assert:
    that:
      - hetzner_acme_email | length > 0
      - hetzner_domains.values() | select('search', '\.invalid$|\.home\.arpa$') | list | length == 0
      - hetzner_private_sites | length == 0 or hetzner_private_web_networks | length > 0
      - "'0.0.0.0/0' not in hetzner_private_web_networks"
      - "'::/0' not in hetzner_private_web_networks"
      - hetzner_private_sites | difference(['dev_backend', 'dev_frontend', 'dev_dashboard', 'icinga']) | length == 0

- name: Validate domain names before using them in nginx or ACME
  ansible.builtin.assert:
    that:
      - item is match('^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$')
  loop: "{{ hetzner_domains.values() | list }}"

- name: Validate private HTTP access CIDRs
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import ipaddress,sys;
        network=ipaddress.ip_network(sys.argv[1],strict=True);
        sys.exit(0 if network.prefixlen > 0 else 1)
      - "{{ item }}"
  loop: "{{ hetzner_private_web_networks }}"
  changed_when: false

- name: Validate exact trusted legacy analytics proxy addresses
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import ipaddress,sys; ipaddress.ip_address(sys.argv[1])
      - "{{ item }}"
  loop: "{{ plausible_legacy_proxy_addresses }}"
  changed_when: false

- name: Build ingress mappings for all public HTTP services
  ansible.builtin.set_fact:
    debian13_ingress_sites:
      - key: dev_frontend
        domain: "{{ hetzner_domains.dev_frontend }}"
        upstream: "{{ hostvars['dev01'].ansible_host }}"
        instance: dev01
        max_body_size: "{{ (hostvars['dev01'].backend_pluto_image_max_file_size | int + 1) * 1048576 }}"
      - key: dev_backend
        domain: "{{ hetzner_domains.dev_backend }}"
        upstream: "{{ hostvars['dev01'].ansible_host }}"
        instance: dev01
        max_body_size: "{{ (hostvars['dev01'].backend_pluto_image_max_file_size | int + 1) * 1048576 }}"
      - key: prod_frontend
        domain: "{{ hetzner_domains.prod_frontend }}"
        upstream: "{{ hostvars['prod01'].ansible_host }}"
        instance: prod01
        max_body_size: "{{ (hostvars['prod01'].backend_pluto_image_max_file_size | int + 1) * 1048576 }}"
      - key: prod_backend
        domain: "{{ hetzner_domains.prod_backend }}"
        upstream: "{{ hostvars['prod01'].ansible_host }}"
        instance: prod01
        max_body_size: "{{ (hostvars['prod01'].backend_pluto_image_max_file_size | int + 1) * 1048576 }}"
      - {key: icinga, domain: "{{ hetzner_domains.icinga }}", upstream: "{{ hostvars['mon01'].ansible_host }}", instance: mon01}
      - {key: nominatim, domain: "{{ hetzner_domains.nominatim }}", upstream: "{{ hostvars['nom01'].ansible_host }}", instance: nom01}
      - {key: versatiles, domain: "{{ hetzner_domains.versatiles }}", upstream: "{{ hostvars['vers01'].ansible_host }}", instance: vers01}

- name: Route the enabled development dashboard through the central ingress
  ansible.builtin.set_fact:
    debian13_ingress_sites: >-
      {{ debian13_ingress_sites + [{'key': 'dev_dashboard', 'domain': hetzner_domains.dev_dashboard,
          'upstream': hostvars['dev01'].ansible_host, 'instance': 'dev01',
          'max_body_size': (hostvars['dev01'].backend_pluto_image_max_file_size | int + 1) * 1048576}] }}
  when: hostvars['dev01'].dashboard_enabled | default(false) | bool

- name: Route the enabled native analytics service through the central ingress
  ansible.builtin.set_fact:
    debian13_ingress_sites: >-
      {{ debian13_ingress_sites + [{'key': 'plausible', 'domain': hetzner_domains.plausible,
          'upstream': hostvars['plausible01'].ansible_host, 'instance': 'plausible01'}] }}
  when: plausible_enabled | bool

- name: Install public ingress packages without starting a default site
  ansible.builtin.apt:
    name: [nginx, certbot]
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Create ACME challenge webroot
  ansible.builtin.file:
    path: /var/www/letsencrypt
    state: directory
    mode: '0755'

- name: Create IP test webroot
  ansible.builtin.file:
    path: /var/www/uranus-ip-test
    state: directory
    mode: '0755'
  when: debian13_ingress_ip_testing | bool

- name: Install IP test page
  ansible.builtin.template:
    src: ip-test.html.j2
    dest: /var/www/uranus-ip-test/index.html
    mode: '0644'
  when: debian13_ingress_ip_testing | bool

- name: Install the Europe map for IP testing
  ansible.builtin.template:
    src: ip-map.html.j2
    dest: /var/www/uranus-ip-test/map.html
    mode: '0644'
  when:
    - debian13_ingress_ip_testing | bool
    - debian13_ingress_ip_tiles | bool

- name: Remove distribution default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Discover already certified ingress domains
  ansible.builtin.include_tasks: certificates.yml

- name: Render HTTP challenge routes while preserving existing HTTPS sites
  ansible.builtin.template:
    src: ingress.conf.j2
    dest: /etc/nginx/sites-available/uranus-hetzner.conf
    mode: '0644'
  register: debian13_ingress_bootstrap_config

- name: Enable dedicated ingress site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/uranus-hetzner.conf
    dest: /etc/nginx/sites-enabled/uranus-hetzner.conf
    state: link
  register: debian13_ingress_enable_site

- name: Validate bootstrap nginx configuration
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false

- name: Start HTTP ACME bootstrap server
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Restart bootstrap nginx to replace distribution wildcard listeners
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
  when: debian13_ingress_bootstrap_config.changed or debian13_ingress_enable_site.changed

- name: Configure trusted public TLS after DNS is ready
  ansible.builtin.include_tasks: tls.yml
  when: not debian13_ingress_prepare_only | bool
