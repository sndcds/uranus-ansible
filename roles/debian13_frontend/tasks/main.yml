---
- name: Require a supported frontend runtime
  ansible.builtin.assert:
    that: frontend_runtime in ['static', 'node']

- name: Deploy the static frontend
  ansible.builtin.include_tasks: static.yml
  when: frontend_runtime == 'static'

- name: Deploy the Nuxt server frontend
  ansible.builtin.include_tasks: node.yml
  when: frontend_runtime == 'node'
