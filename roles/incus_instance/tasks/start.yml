---
- name: Guard filesystem immediately before starting the instance
  uranus_storage_guard: {}

- name: Start the validated instance and report startup diagnostics on failure
  block:
    - name: Start the instance through Incus
      ansible.builtin.command:
        argv: [incus, --force-local, --project, uranus, start, "{{ incus_instance_name }}"]
      changed_when: true
  rescue:
    - name: Read the failed instance log through Incus
      ansible.builtin.command:
        argv: [incus, --force-local, --project, uranus, info, --show-log, "{{ incus_instance_name }}"]
      register: incus_instance_start_log
      changed_when: false
      failed_when: false

    - name: Report the start failure while retaining the initialized instance
      ansible.builtin.fail:
        msg: |
          Incus could not start {{ incus_instance_name }}; the initialized instance and its disk have been retained.
          Start error: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg, true) }}
          Incus info --show-log (rc={{ incus_instance_start_log.rc | default('unknown') }}):
          {{ incus_instance_start_log.stdout | default('') }}
          {{ incus_instance_start_log.stderr | default('') }}
