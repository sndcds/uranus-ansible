---
- name: Guard filesystem before configuring the instance DHCP client
  uranus_storage_guard: {}

- name: Use MAC-based DHCP and verify the reserved instance address through Incus
  ansible.builtin.command:
    argv: [incus, --force-local, --project, uranus, exec, "{{ incus_instance.name }}", --, timeout, '150', sh, -s]
    stdin: "{{ lookup('template', 'dhcp-mac.sh.j2') }}"
  register: incus_instance_network
  changed_when: "'changed' in incus_instance_network.stdout_lines"
  retries: 3
  delay: 2
  until: incus_instance_network.rc == 0
