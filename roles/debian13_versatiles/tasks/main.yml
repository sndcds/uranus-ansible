---
- name: Require a pinned release archive and frontend
  ansible.builtin.assert:
    that:
      - hetzner_versatiles_archive_url is match('^https://')
      - hetzner_versatiles_archive_sha256 is match('^[0-9a-f]{64}$')
      - hetzner_versatiles_frontend_url is match('^https://')
      - hetzner_versatiles_frontend_sha256 is match('^[0-9a-f]{64}$')
      - versatiles_tiles_url is match('^https://')
      - versatiles_tileset_name is match('^[a-zA-Z0-9_-]+\.versatiles$')
    fail_msg: Provide verified release assets and checksums; remote installer scripts are not executed.

- name: Validate the map extent before any download
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import sys;
        west,south,east,north=map(float,sys.argv[1].split(','));
        assert -180 <= west < east <= 180 and -85.051129 <= south < north <= 85.051129
      - "{{ versatiles_bbox }}"
  changed_when: false

- name: Create VersaTiles service user
  ansible.builtin.user:
    name: "{{ versatiles_system_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ versatiles_data_dir }}"
    create_home: true

- name: Create VersaTiles data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ versatiles_system_user }}"
    group: "{{ versatiles_system_user }}"
    mode: '0750'
  loop:
    - "{{ versatiles_data_dir }}"
    - "{{ versatiles_data_dir }}/frontend"
    - "{{ versatiles_data_dir }}/tiles"
    - /var/log/versatiles

- name: Create protected release archive cache
  ansible.builtin.file:
    path: /var/cache/uranus
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download pinned VersaTiles release archive
  ansible.builtin.get_url:
    url: "{{ hetzner_versatiles_archive_url }}"
    dest: "/var/cache/uranus/versatiles-{{ hetzner_versatiles_archive_sha256[:16] }}.tar.gz"
    checksum: "sha256:{{ hetzner_versatiles_archive_sha256 }}"
    owner: root
    group: root
    mode: '0644'
  register: debian13_versatiles_archive

- name: Create the immutable executable release directory
  ansible.builtin.file:
    path: "{{ debian13_versatiles_release_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Unpack the verified executable into its immutable release directory
  ansible.builtin.unarchive:
    src: "/var/cache/uranus/versatiles-{{ hetzner_versatiles_archive_sha256[:16] }}.tar.gz"
    dest: "{{ debian13_versatiles_release_dir }}"
    remote_src: true
    include: [versatiles]
    owner: root
    group: root
    mode: '0755'

- name: Activate the pinned executable
  ansible.builtin.file:
    src: "{{ debian13_versatiles_release_dir }}/versatiles"
    dest: /usr/local/bin/versatiles
    state: link
  notify: Restart Debian VersaTiles

- name: Download map frontend bundle
  ansible.builtin.get_url:
    url: "{{ hetzner_versatiles_frontend_url }}"
    dest: "{{ versatiles_data_dir }}/frontend/frontend.br.tar.gz"
    owner: "{{ versatiles_system_user }}"
    group: "{{ versatiles_system_user }}"
    mode: '0640'
    force: false
    checksum: "sha256:{{ hetzner_versatiles_frontend_sha256 }}"
  notify: Restart Debian VersaTiles

- name: Inspect the existing completed tileset
  ansible.builtin.stat:
    path: "{{ versatiles_data_dir }}/tiles/{{ versatiles_tileset_name }}"
    get_checksum: false
  register: debian13_versatiles_tileset

- name: Import a new tileset without exposing a partial download
  ansible.builtin.include_tasks: import.yml
  when: not debian13_versatiles_tileset.stat.exists

- name: Verify that the completed tileset can be opened
  ansible.builtin.command:
    argv:
      - /usr/local/bin/versatiles
      - probe
      - "{{ versatiles_data_dir }}/tiles/{{ versatiles_tileset_name }}"
  become: true
  become_user: "{{ versatiles_system_user }}"
  changed_when: false

- name: Install private VersaTiles service
  ansible.builtin.template:
    src: "versatiles.service.j2"
    dest: /etc/systemd/system/versatiles.service
    mode: '0644'
  notify: Restart Debian VersaTiles

- name: Start private VersaTiles
  ansible.builtin.systemd_service:
    name: versatiles
    daemon_reload: true
    state: started
    enabled: true

- name: Apply updated VersaTiles configuration before checking health
  ansible.builtin.meta: flush_handlers

- name: Check the running tile metadata endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ versatiles_port }}/tiles/osm/tiles.json"
    return_content: true
    status_code: 200
  register: debian13_versatiles_health
  retries: 10
  delay: 2
  until: debian13_versatiles_health.status == 200

- name: Require a usable vector tileset
  ansible.builtin.assert:
    that:
      - debian13_versatiles_health.json.tiles | length > 0
      - debian13_versatiles_health.json.maxzoom | int == 14
