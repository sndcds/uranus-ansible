---
- name: Create dedicated firewall configuration directory
  ansible.builtin.file:
    path: /etc/uranus
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render host firewall without flushing other nftables tables
  ansible.builtin.template:
    src: host-firewall.nft.j2
    dest: /etc/uranus/host-firewall.nft
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/nft --check --file %s
  notify: Reload Debian host firewall

- name: Install dedicated firewall service
  ansible.builtin.copy:
    dest: /etc/systemd/system/uranus-host-firewall.service
    mode: '0644'
    content: |
      [Unit]
      Description=Uranus dedicated host input firewall
      Before=libvirtd.service virtqemud.service
      After=network-pre.target
      Wants=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft --file /etc/uranus/host-firewall.nft
      ExecReload=/usr/sbin/nft --file /etc/uranus/host-firewall.nft
      [Install]
      WantedBy=multi-user.target
  notify: Reload Debian hypervisor systemd

- name: Load firewall service unit
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and start dedicated firewall service
  ansible.builtin.systemd_service:
    name: uranus-host-firewall
    enabled: true
    state: started
