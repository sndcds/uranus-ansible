---
- name: Install private guest nginx without starting the default site
  ansible.builtin.apt:
    name: nginx
    state: present
    policy_rc_d: 101

- name: Remove distribution default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Debian guest nginx

- name: Render private application vhosts
  ansible.builtin.template:
    src: guest.conf.j2
    dest: /etc/nginx/sites-available/uranus-debian13.conf
    mode: '0644'
  notify: Reload Debian guest nginx

- name: Enable private vhosts
  ansible.builtin.file:
    src: /etc/nginx/sites-available/uranus-debian13.conf
    dest: /etc/nginx/sites-enabled/uranus-debian13.conf
    state: link
  notify: Reload Debian guest nginx

- name: Validate private guest nginx configuration
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false

- name: Start private guest nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Validate frontend activation over internal TLS with code rollback
  when: instance_role in ['dev', 'prod']
  block:
    - name: Apply pending nginx reloads before checking the active frontend
      ansible.builtin.meta: flush_handlers
    - name: Require the newly served static frontend to answer successfully
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}{{ frontend_health_endpoint }}"
        headers:
          Host: "{{ frontend_domain }}"
        ca_path: /etc/ssl/certs/uranus-ca.pem
        status_code: 200
  rescue:
    - name: Restore the previous frontend artifact when available
      ansible.builtin.file:
        src: "{{ debian13_frontend_previous.stat.lnk_source }}"
        dest: /opt/uranus/frontend/current
        state: link
      when: debian13_frontend_previous.stat.exists
    - name: Report frontend activation failure and preserve release artifacts
      ansible.builtin.fail:
        msg: >-
          Frontend healthcheck failed: {{ ansible_failed_result.msg | default('unknown error') }}.
          Previous static artifact restored when available. Review before retry.
