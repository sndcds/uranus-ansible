---
- name: Require reviewed immutable backend inputs
  ansible.builtin.assert:
    that:
      - backend_repo_version is match('^[0-9a-f]{40}$')
      - backend_go_archive_sha256 is match('^[0-9a-f]{64}$')
      - backend_go_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - backend_ssl_mode == 'verify-full'
      - backend_db_schema == 'uranus'
    fail_msg: Pin a reviewed commit and toolchain. Deployment no longer patches source or disables consistency checks.

- name: Install backend build dependencies
  ansible.builtin.apt:
    name: [git, build-essential, tar]
    state: present

- name: Create backend service user
  ansible.builtin.user:
    name: uranus
    system: true
    create_home: true
    shell: /bin/bash

- name: Create release and persistent application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: uranus
    group: uranus
    # Nginx must traverse the shared parent to reach the public frontend.
    mode: "{{ '0751' if item == '/opt/uranus' else '0750' }}"
  loop:
    - /opt/uranus
    - /opt/uranus/backend
    - /opt/uranus/backend/releases
    - "/opt/uranus/backend/releases/{{ backend_repo_version }}"
    - "/opt/uranus/backend/releases/{{ backend_repo_version }}/bin"
    - /opt/uranus/backend/profile_images
    - /opt/uranus/backend/pluto/images
    - /opt/uranus/backend/pluto/cache
    - /var/log/uranus

- name: Create versioned toolchain directory without replacing other versions
  ansible.builtin.file:
    path: "/opt/uranus/toolchains/{{ backend_go_version }}"
    state: directory
    mode: '0755'

- name: Download verified Go toolchain
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ backend_go_version }}.linux-amd64.tar.gz"
    dest: "/var/cache/go{{ backend_go_version }}.tar.gz"
    checksum: "sha256:{{ backend_go_archive_sha256 }}"
    mode: '0644'

- name: Extract only absent versioned toolchain
  ansible.builtin.unarchive:
    src: "/var/cache/go{{ backend_go_version }}.tar.gz"
    dest: "/opt/uranus/toolchains/{{ backend_go_version }}"
    remote_src: true
    creates: "/opt/uranus/toolchains/{{ backend_go_version }}/go/bin/go"

- name: Check out pinned backend without modifying its sources
  ansible.builtin.git:
    repo: "{{ backend_repo_url }}"
    dest: "/opt/uranus/backend/releases/{{ backend_repo_version }}/source"
    version: "{{ backend_repo_version }}"
    force: false
  become: true
  become_user: uranus

- name: Build only absent release with immutable module metadata
  ansible.builtin.command:
    argv:
      - "/opt/uranus/toolchains/{{ backend_go_version }}/go/bin/go"
      - build
      - -mod=readonly
      - -trimpath
      - -o
      - "/opt/uranus/backend/releases/{{ backend_repo_version }}/bin/uranus-api"
      - ./uranus-api.go
    chdir: "/opt/uranus/backend/releases/{{ backend_repo_version }}/source"
    creates: "/opt/uranus/backend/releases/{{ backend_repo_version }}/bin/uranus-api"
  become: true
  become_user: uranus
  environment:
    GOTOOLCHAIN: local

- name: Render protected per-release configuration with recovery copy
  ansible.builtin.template:
    src: config.json.j2
    dest: "/opt/uranus/backend/releases/{{ backend_repo_version }}/config.json"
    owner: uranus
    group: uranus
    mode: '0600'
    backup: true
    validate: /usr/bin/python3 -m json.tool %s
  register: debian13_backend_config
  no_log: true

- name: Inspect current backend release
  ansible.builtin.stat:
    path: /opt/uranus/backend/current
    follow: false
  register: debian13_backend_previous

- name: Require a managed release symlink
  ansible.builtin.assert:
    that:
      - not debian13_backend_previous.stat.exists or debian13_backend_previous.stat.islnk
      - not debian13_backend_previous.stat.exists or debian13_backend_previous.stat.lnk_source is match('^/opt/uranus/backend/releases/[0-9a-f]{40}$')

- name: Install backend service for the active release
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/uranus-backend.service
    mode: '0644'
  register: debian13_backend_unit

- name: Activate and verify backend with automatic code rollback
  block:
    - name: Activate reviewed backend release
      ansible.builtin.file:
        src: "/opt/uranus/backend/releases/{{ backend_repo_version }}"
        dest: /opt/uranus/backend/current
        state: link
        owner: uranus
        group: uranus
      register: debian13_backend_activation
    - name: Start or restart only changed backend configuration
      ansible.builtin.systemd_service:
        name: uranus-backend
        enabled: true
        daemon_reload: "{{ debian13_backend_unit is changed }}"
        state: >-
          {{ 'restarted' if debian13_backend_activation is changed or
             debian13_backend_config is changed or debian13_backend_unit is changed else 'started' }}
    - name: Require a healthy local backend before completing activation
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}{{ api_health_endpoint }}"
        status_code: 200
      register: debian13_backend_health
      retries: 10
      delay: 3
      until: debian13_backend_health.status | default(0) == 200
  rescue:
    - name: Restore previous configuration after a failed restart
      ansible.builtin.copy:
        src: "{{ debian13_backend_config.backup_file }}"
        dest: "/opt/uranus/backend/releases/{{ backend_repo_version }}/config.json"
        remote_src: true
        owner: uranus
        group: uranus
        mode: '0600'
      when: debian13_backend_config.backup_file is defined
      no_log: true
    - name: Restore previous backend release if one exists
      ansible.builtin.file:
        src: "{{ debian13_backend_previous.stat.lnk_source }}"
        dest: /opt/uranus/backend/current
        state: link
      when: debian13_backend_previous.stat.exists
    - name: Restart preserved previous release
      ansible.builtin.systemd_service:
        name: uranus-backend
        state: restarted
      when: debian13_backend_previous.stat.exists
    - name: Stop an unhealthy first installation
      ansible.builtin.systemd_service:
        name: uranus-backend
        state: stopped
      when: not debian13_backend_previous.stat.exists
    - name: Report failed activation and preserve all releases and data
      ansible.builtin.fail:
        msg: >-
          Backend healthcheck failed. Previous release restored when available;
          inspect before retry. No database migration or release deletion was performed.

- name: Install private image metrics writer
  ansible.builtin.template:
    src: pluto-image-metrics-push.sh.j2
    dest: /usr/local/bin/pluto-image-metrics-push
    mode: '0755'
  when: pluto_metrics_enabled | bool

- name: Install metrics service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop: [pluto-image-metrics.service, pluto-image-metrics.timer]
  when: pluto_metrics_enabled | bool

- name: Enable metrics schedule
  ansible.builtin.systemd_service:
    name: pluto-image-metrics.timer
    daemon_reload: true
    enabled: true
    state: started
  when: pluto_metrics_enabled | bool
