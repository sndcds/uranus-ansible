---
- name: Copy the requested initial SQL dump
  ansible.builtin.copy:
    src: "{{ debian13_postgresql_dump_root }}/{{ application_db.dump_file }}"
    dest: "{{ debian13_postgresql_state_dir }}/{{ application_db.name }}.initial.sql"
    owner: "{{ debian13_postgresql_owner }}"
    group: "{{ debian13_postgresql_group }}"
    mode: '0600'

- name: Remove source-specific owner statements from the initial dump
  ansible.builtin.replace:
    path: "{{ debian13_postgresql_state_dir }}/{{ application_db.name }}.initial.sql"
    regexp: '^ALTER (SCHEMA|TYPE|FUNCTION|TABLE|SEQUENCE) .* OWNER TO oklab;$'
    replace: '-- stripped source owner statement'

- name: Reject psql commands that can escape the selected database
  uranus_sql_dump_guard:
    path: "{{ debian13_postgresql_state_dir }}/{{ application_db.name }}.initial.sql"

- name: Import the new database atomically without dropping it
  ansible.builtin.command:
    argv:
      - psql
      - --no-psqlrc
      - --single-transaction
      - --set=ON_ERROR_STOP=1
      - "--host={{ debian13_postgresql_socket }}"
      - "--username={{ application_db.user }}"
      - "--dbname={{ application_db.name }}"
      - "--file={{ debian13_postgresql_state_dir }}/{{ application_db.name }}.initial.sql"
  become: true
  become_user: postgres
  changed_when: true
  environment:
    PGPASSWORD: "{{ application_db.password }}"
  no_log: true
