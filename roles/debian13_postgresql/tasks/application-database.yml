---
- name: Check for an interrupted initial import
  ansible.builtin.stat:
    path: "{{ debian13_postgresql_state_dir }}/.{{ application_db.name }}_initial_import_pending"
  register: debian13_postgresql_import_pending

- name: Stop rather than retry an interrupted import
  ansible.builtin.assert:
    that: not debian13_postgresql_import_pending.stat.exists
    fail_msg: >-
      A previous initial import was interrupted. Preserve the database and
      recover manually; automatic reimport is prohibited.

- name: Inspect database existence before any creation
  community.postgresql.postgresql_query:
    login_unix_socket: "{{ debian13_postgresql_socket }}"
    db: postgres
    query: SELECT oid FROM pg_database WHERE datname = %(name)s
    named_args:
      name: "{{ application_db.name }}"
  become: true
  become_user: postgres
  register: debian13_postgresql_existing_db

- name: Inspect evidence of a previously completed initialization
  ansible.builtin.stat:
    path: "{{ debian13_postgresql_state_dir }}/.{{ application_db.name }}_initial_import_complete"
  register: debian13_postgresql_initialization_complete

- name: Stop if a previously initialized database has disappeared
  ansible.builtin.assert:
    that: not debian13_postgresql_initialization_complete.stat.exists or debian13_postgresql_existing_db.rowcount > 0
    fail_msg: Previously initialized database is missing; restore it manually instead of creating a replacement.

- name: Claim initialization durably before creating any new database
  uranus_initialization_guard:
    state_dir: "{{ debian13_postgresql_state_dir }}"
    database: "{{ application_db.name }}"
    state: claimed
    import_requested: "{{ hetzner_app_initial_import | bool }}"
  become: true
  become_user: "{{ debian13_postgresql_owner }}"
  when: debian13_postgresql_existing_db.rowcount == 0
  register: debian13_postgresql_initialization_claim

- name: Create only an absent application database
  community.postgresql.postgresql_db:
    login_unix_socket: "{{ debian13_postgresql_socket }}"
    name: "{{ application_db.name }}"
    owner: "{{ application_db.user }}"
    state: present
  become: true
  become_user: postgres
  when: debian13_postgresql_existing_db.rowcount == 0
  register: debian13_postgresql_created_db

- name: Stop if another process created the database after the exclusive claim
  ansible.builtin.assert:
    that: debian13_postgresql_created_db is changed
    fail_msg: Database appeared concurrently; preserve it and recover the pending initialization manually.
  when: debian13_postgresql_existing_db.rowcount == 0

- name: Enable PostGIS without replacing application data
  community.postgresql.postgresql_ext:
    login_unix_socket: "{{ debian13_postgresql_socket }}"
    name: postgis
    db: "{{ application_db.name }}"
    state: present
  become: true
  become_user: postgres
  when: debian13_postgresql_postgis_enabled | bool

- name: Initialize only a newly created database when explicitly requested
  ansible.builtin.include_tasks: initial-import.yml
  when:
    - debian13_postgresql_created_db is changed
    - hetzner_app_initial_import | bool
    - application_db.dump_file is defined

- name: Create the application schema without altering existing objects
  community.postgresql.postgresql_schema:
    login_unix_socket: "{{ debian13_postgresql_socket }}"
    name: uranus
    db: "{{ application_db.name }}"
    owner: "{{ application_db.user }}"
    state: present
  become: true
  become_user: postgres

- name: Grant access to existing application tables
  community.postgresql.postgresql_privs:
    login_unix_socket: "{{ debian13_postgresql_socket }}"
    database: "{{ application_db.name }}"
    roles: "{{ application_db.user }}"
    type: table
    schema: uranus
    objs: ALL_IN_SCHEMA
    privs: SELECT,INSERT,UPDATE,DELETE
  become: true
  become_user: postgres

- name: Grant access to existing application sequences
  community.postgresql.postgresql_privs:
    login_unix_socket: "{{ debian13_postgresql_socket }}"
    database: "{{ application_db.name }}"
    roles: "{{ application_db.user }}"
    type: sequence
    schema: uranus
    objs: ALL_IN_SCHEMA
    privs: USAGE,SELECT,UPDATE
  become: true
  become_user: postgres

- name: Complete initialization only after import schema and grants succeeded
  uranus_initialization_guard:
    state_dir: "{{ debian13_postgresql_state_dir }}"
    database: "{{ application_db.name }}"
    state: completed
    token: "{{ debian13_postgresql_initialization_claim.token }}"
  become: true
  become_user: "{{ debian13_postgresql_owner }}"
  when: debian13_postgresql_existing_db.rowcount == 0
