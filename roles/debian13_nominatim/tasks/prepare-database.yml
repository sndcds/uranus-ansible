---
- name: Prepare the new database with temporary elevated privileges
  block:
    - name: Grant privileges only for database and extension preparation
      community.postgresql.postgresql_user:
        login_unix_socket: "{{ debian13_nominatim_db_socket }}"
        port: "{{ debian13_nominatim_db_port }}"
        name: "{{ nominatim_db_user }}"
        role_attr_flags: SUPERUSER
      delegate_to: "{{ nominatim_db_delegate_host }}"
      become: true
      become_user: postgres
    - name: Create the absent Nominatim database and required extensions
      ansible.builtin.command:
        argv:
          - "{{ debian13_nominatim_venv }}/bin/nominatim"
          - import
          - --project-dir
          - "{{ nominatim_project_dir }}"
          - --prepare-database
      become: true
      become_user: nominatim
      changed_when: true
      no_log: true
  always:
    - name: Revoke preparation privileges even if database preparation failed
      community.postgresql.postgresql_user:
        login_unix_socket: "{{ debian13_nominatim_db_socket }}"
        port: "{{ debian13_nominatim_db_port }}"
        name: "{{ nominatim_db_user }}"
        role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
      delegate_to: "{{ nominatim_db_delegate_host }}"
      become: true
      become_user: postgres
