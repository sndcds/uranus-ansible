---
- name: Verify Nominatim database and import prerequisites
  ansible.builtin.import_tasks: preflight.yml

- name: Install Nominatim prerequisites
  ansible.builtin.apt:
    name: [osm2pgsql, postgresql-client-17, build-essential, python3-dev, pkg-config, libicu-dev, libpq-dev, python3-venv, python3-pip, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Nominatim service user
  ansible.builtin.user:
    name: nominatim
    home: /srv/nominatim
    shell: /bin/bash
    create_home: true

- name: Create Nominatim data and project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nominatim
    group: www-data
    mode: '0750'
  loop:
    - /srv/nominatim
    - /srv/nominatim/data
    - "{{ nominatim_project_dir }}"
    - /var/log/nominatim

- name: Create the immutable release parent outside the service home
  ansible.builtin.file:
    path: "/opt/nominatim/{{ hetzner_nominatim_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install pinned Nominatim into an isolated Python environment
  ansible.builtin.pip:
    name:
      - "nominatim-db=={{ hetzner_nominatim_version }}"
      - "nominatim-api=={{ hetzner_nominatim_version }}"
      - psycopg[binary]
      - "gunicorn=={{ debian13_nominatim_gunicorn_version }}"
      - "falcon=={{ debian13_nominatim_falcon_version }}"
    virtualenv: "{{ debian13_nominatim_venv }}"
    virtualenv_command: python3 -m venv

- name: Allow service access to the isolated Python environment
  ansible.builtin.file:
    path: "{{ debian13_nominatim_venv }}"
    state: directory
    mode: '0755'

- name: Deploy Nominatim database environment
  ansible.builtin.template:
    src: "nominatim.env.j2"
    dest: "{{ nominatim_project_dir }}/.env"
    owner: nominatim
    group: www-data
    mode: '0640'
  no_log: true
  notify: Restart Debian Nominatim

- name: Import Nominatim only when the database is absent
  when: debian13_nominatim_database.rowcount == 0
  block:
    - name: Download the selected initial OSM extract
      ansible.builtin.get_url:
        url: "{{ nominatim_data_url }}"
        checksum: "sha256:{{ nominatim_data_sha256 }}"
        dest: "{{ nominatim_data_file }}"
        owner: nominatim
        group: www-data
        mode: '0640'
    - name: Prepare the absent database with bounded temporary privileges
      ansible.builtin.include_tasks: prepare-database.yml
    - name: Import and index the verified extract without superuser privileges
      ansible.builtin.command:
        argv:
          - "{{ debian13_nominatim_venv }}/bin/nominatim"
          - import
          - --project-dir
          - "{{ nominatim_project_dir }}"
          - --continue
          - import-from-file
          - --osm-file
          - "{{ nominatim_data_file }}"
          - --threads
          - "{{ debian13_nominatim_import_threads | string }}"
          - --no-updates
      become: true
      become_user: nominatim
      async: "{{ debian13_nominatim_import_timeout }}"
      poll: 10
      no_log: true
      changed_when: true

- name: Check Nominatim integrity before serving requests
  ansible.builtin.command:
    argv: ["{{ debian13_nominatim_venv }}/bin/nominatim", admin, --project-dir, "{{ nominatim_project_dir }}", --check-database]
  become: true
  become_user: nominatim
  changed_when: false

- name: Install Nominatim socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/nominatim.socket
    mode: '0644'
    content: |
      [Unit]
      Description=Private Nominatim API socket
      [Socket]
      ListenStream=/run/nominatim.sock
      SocketUser=www-data
      SocketGroup=www-data
      SocketMode=0660
      [Install]
      WantedBy=sockets.target
  notify: Restart Debian Nominatim socket

- name: Validate the native ASGI application before installing its service
  ansible.builtin.command:
    argv:
      - "{{ debian13_nominatim_venv }}/bin/gunicorn"
      - --worker-class
      - asgi
      - --protocol
      - http
      - --check-config
      - "nominatim_api.server.falcon.server:run_wsgi()"
    chdir: "{{ nominatim_project_dir }}"
  become: true
  become_user: nominatim
  changed_when: false
  no_log: true

- name: Install Nominatim service
  ansible.builtin.template:
    src: nominatim.service.j2
    dest: /etc/systemd/system/nominatim.service
    mode: '0644'
  notify: Restart Debian Nominatim

- name: Enable Nominatim socket and service
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop: [nominatim.socket, nominatim.service]

- name: Activate pending Nominatim configuration before health verification
  ansible.builtin.meta: flush_handlers

- name: Require a healthy Nominatim API over its private HTTP socket
  ansible.builtin.uri:
    url: http://localhost/status?format=json
    unix_socket: /run/nominatim.sock
    return_content: true
    status_code: 200
  register: debian13_nominatim_health
  retries: 12
  delay: 5
  until: debian13_nominatim_health.status == 200

- name: Require Nominatim to report a working database
  ansible.builtin.assert:
    that: debian13_nominatim_health.json.status | int == 0
