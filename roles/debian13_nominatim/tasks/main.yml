---
- name: Inspect Nominatim database existence without modifying it
  community.postgresql.postgresql_query:
    db: postgres
    query: SELECT oid FROM pg_database WHERE datname = %(name)s
    named_args: {name: "{{ nominatim_db_name }}"}
  delegate_to: db01
  become: true
  become_user: postgres
  register: debian13_nominatim_database

- name: Require explicit first import if no Nominatim database exists
  ansible.builtin.assert:
    that: debian13_nominatim_database.rowcount > 0 or hetzner_nominatim_initial_import | bool
    fail_msg: >-
      Nominatim has no database. Authorize an initial import explicitly or restore
      an existing database. The role never drops or replaces a database.

- name: Inspect existing Nominatim schema independently of local marker files
  community.postgresql.postgresql_query:
    db: "{{ nominatim_db_name }}"
    query: SELECT to_regclass('public.placex')::text AS sentinel
  delegate_to: db01
  become: true
  become_user: postgres
  register: debian13_nominatim_schema
  when: debian13_nominatim_database.rowcount > 0

- name: Stop on an incomplete existing Nominatim database
  ansible.builtin.assert:
    that: debian13_nominatim_schema.query_result[0].sentinel is not none
    fail_msg: Incomplete Nominatim database found; preserve it and recover manually.
  when: debian13_nominatim_database.rowcount > 0

- name: Install Nominatim prerequisites
  ansible.builtin.apt:
    name: [osm2pgsql, postgresql-client-17, pkg-config, libicu-dev, python3-venv, python3-pip, curl]
    state: present

- name: Create Nominatim service user
  ansible.builtin.user:
    name: nominatim
    home: /srv/nominatim
    shell: /bin/bash
    create_home: true

- name: Create Nominatim data and project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nominatim
    group: www-data
    mode: '0750'
  loop:
    - /srv/nominatim
    - /srv/nominatim/data
    - "{{ nominatim_project_dir }}"
    - /var/log/nominatim

- name: Install pinned Nominatim into an isolated Python environment
  ansible.builtin.pip:
    name:
      - "nominatim-db=={{ hetzner_nominatim_version }}"
      - "nominatim-api=={{ hetzner_nominatim_version }}"
      - psycopg[binary]
      - gunicorn
      - uvicorn
      - falcon
    virtualenv: /srv/nominatim/nominatim-venv
    virtualenv_command: python3 -m venv

- name: Allow service access to the isolated Python environment
  ansible.builtin.file:
    path: /srv/nominatim/nominatim-venv
    state: directory
    mode: '0755'

- name: Deploy Nominatim database environment
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../roles/nominatim/templates/nominatim.env.j2"
    dest: "{{ nominatim_project_dir }}/.env"
    owner: nominatim
    group: www-data
    mode: '0640'
  no_log: true
  notify: Restart Debian Nominatim

- name: Import Nominatim only when the database is absent
  when: debian13_nominatim_database.rowcount == 0
  block:
    - name: Download the selected initial OSM extract
      ansible.builtin.get_url:
        url: "{{ nominatim_data_url }}"
        dest: "{{ nominatim_data_file }}"
        owner: nominatim
        group: www-data
        mode: '0640'
    - name: Grant temporary privileges required by the first Nominatim import
      community.postgresql.postgresql_user:
        name: "{{ nominatim_db_user }}"
        role_attr_flags: SUPERUSER
      delegate_to: db01
      become: true
      become_user: postgres
    - name: Create the absent database through the initial Nominatim import
      ansible.builtin.command:
        argv:
          - /srv/nominatim/nominatim-venv/bin/nominatim
          - import
          - --project-dir
          - "{{ nominatim_project_dir }}"
          - --osm-file
          - "{{ nominatim_data_file }}"
          - --no-updates
      become: true
      become_user: nominatim
      changed_when: true
  always:
    - name: Revoke temporary import privileges even if the import failed
      community.postgresql.postgresql_user:
        name: "{{ nominatim_db_user }}"
        role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
      delegate_to: db01
      become: true
      become_user: postgres

- name: Check Nominatim integrity before serving requests
  ansible.builtin.command:
    argv: [/srv/nominatim/nominatim-venv/bin/nominatim, admin, --project-dir, "{{ nominatim_project_dir }}", --check-database]
  become: true
  become_user: nominatim
  changed_when: false

- name: Install Nominatim socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/nominatim.socket
    mode: '0644'
    content: |
      [Unit]
      Description=Private Nominatim API socket
      [Socket]
      ListenStream=/run/nominatim.sock
      SocketUser=www-data
      SocketGroup=www-data
      SocketMode=0660
      [Install]
      WantedBy=sockets.target
  notify: Restart Debian Nominatim socket

- name: Install Nominatim service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nominatim.service
    mode: '0644'
    content: |
      [Unit]
      Description=Nominatim API
      After=network-online.target
      Requires=nominatim.socket
      [Service]
      User=nominatim
      Group=www-data
      WorkingDirectory={{ nominatim_project_dir }}
      ExecStart=/srv/nominatim/nominatim-venv/bin/gunicorn --bind unix:/run/nominatim.sock \
        --workers 2 --worker-class uvicorn.workers.UvicornWorker \
        "nominatim_api.server.falcon.server:run_wsgi()"
      Restart=on-failure
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=full
      [Install]
      WantedBy=multi-user.target
  notify: Restart Debian Nominatim

- name: Enable Nominatim socket and service
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop: [nominatim.socket, nominatim.service]
