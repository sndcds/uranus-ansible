---
profile: production
offline: true
# Unchanged Ubuntu roles retain their existing behavior. They are syntax checked
# separately; lint applies to the entire new Debian implementation, without skips.
exclude_paths:
  - .git/
  - .ansible/
  - roles/app_backend/
  - roles/app_frontend/
  - roles/postfix/
  - roles/backup/
  - roles/logrotate/
  - roles/common/
  - roles/nginx/
  - roles/certbot/
  - roles/ufw/
  - roles/kvm_ingress/
  - roles/monitoring/
  - roles/nominatim/
  - roles/versatiles/
  - roles/tests/
  - roles/vm_bandwidth_monitoring/
  - group_vars/
  - host_vars/
  - inventory/
  - vars.yml
  - playbooks/configure.yml
  - playbooks/provision.yml
  - playbooks/site.yml
  - playbooks/single_vm.yml
  - playbooks/db01.yml
  - playbooks/dev01.yml
  - playbooks/prod01.yml
  - playbooks/mon01.yml
  - playbooks/nom01.yml
  - playbooks/vers01.yml
