---
- name: Deploy VersaTiles on the dedicated map guest
  hosts: 'uranus_instances:&vers01'
  gather_facts: false
  become: true
  pre_tasks:
    - name: Check deployment authorization
      ansible.builtin.import_tasks: tasks/gate.yml
    - name: Load dedicated map settings and secrets
      ansible.builtin.import_tasks: tasks/guest-vars.yml
    - name: Verify the provisioned Debian guest baseline
      ansible.builtin.import_tasks: tasks/guest-preflight.yml
  roles:
    - role: internal_tls
    - role: debian13_guest
    - role: debian13_versatiles
    - role: debian13_guest_web
