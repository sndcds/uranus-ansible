---
- name: Provision Uranus through Incus
  hosts: incus_hosts
  gather_facts: false
  become: true
  environment:
    INCUS_DIR: /data/incus
  pre_tasks:
    - name: Check deployment authorization
      ansible.builtin.import_tasks: tasks/gate.yml
    - name: Gather host facts
      ansible.builtin.setup:
  roles:
    - role: incus_host
    - role: incus_instance
