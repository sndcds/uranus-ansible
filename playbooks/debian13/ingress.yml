---
- name: Terminate public TLS at the dedicated host reverse proxy
  hosts: debian13_hypervisors
  gather_facts: false
  become: true
  pre_tasks:
    - name: Check deployment authorization
      ansible.builtin.import_tasks: gate.yml
    - name: Check protected storage before ingress configuration
      uranus_storage_guard: {}
  roles:
    - role: debian13_ingress
