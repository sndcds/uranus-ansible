---
- name: Deploy the Kulturbytes client to development and production
  hosts: 'dev01:prod01'
  order: sorted
  serial: 1
  gather_facts: false
  become: true
  pre_tasks:
    - name: Check deployment authorization
      ansible.builtin.import_tasks: tasks/gate.yml
    - name: Load environment-specific frontend settings
      ansible.builtin.import_tasks: tasks/guest-vars.yml
    - name: Verify the provisioned Debian guest baseline
      ansible.builtin.import_tasks: tasks/guest-preflight.yml
  roles:
    - role: internal_tls
    - role: debian13_guest
    - role: debian13_frontend
