---
name: Incus and application validation
on:
  pull_request:
  push:
    branches: [main, 'feat/incus-migration']
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install local validation tools
        run: |
          python -m pip install -r requirements-test.txt
          sudo apt-get update
          sudo apt-get install -y cloud-init nginx postgresql postgresql-16-postgis-3 python3-psycopg2
      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run local tests, all syntax checks and Debian lint
        run: make check
  debian13-native-validation:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Install native Debian test dependencies without daemon startup
        run: |
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git make ca-certificates python3 python3-venv python3-psycopg2 \
            cloud-init nginx \
            postgresql-17 postgresql-17-postgis-3
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned validation dependencies
        run: |
          python3 -m venv /opt/uranus-qa
          /opt/uranus-qa/bin/python -m pip install -r requirements-test.txt
          /opt/uranus-qa/bin/ansible-galaxy collection install -r requirements.yml -p /opt/ansible/collections
      - name: Run validation as an unprivileged user on Debian 13
        run: |
          useradd --create-home --shell /bin/bash uranus-test
          chown -R uranus-test:uranus-test "$GITHUB_WORKSPACE"
          runuser --user uranus-test -- env \
            PATH="/opt/uranus-qa/bin:$PATH" \
            ANSIBLE_COLLECTIONS_PATH=/opt/ansible/collections make check
  debian13-incus-contract:
    runs-on: ubuntu-24.04
    container:
      image: debian:13
      options: --privileged --volume /lib/modules:/lib/modules:ro
    timeout-minutes: 20
    steps:
      - name: Install native Incus without starting package services
        run: |
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git ca-certificates python3 python3-venv incus incus-client openssh-client openssh-server icinga2 icinga2-ido-pgsql kmod
          install -d -m 0755 /run/sshd
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install template rendering dependencies
        run: |
          python3 -m venv /opt/uranus-contract
          /opt/uranus-contract/bin/pip install PyYAML==6.0.3 Jinja2==3.1.6
      - name: Load VM transport only on the disposable GitHub runner
        run: |
          modprobe vhost_vsock
          for qa_vsock_node in vsock vhost-vsock; do
            if ! test -c "/dev/$qa_vsock_node"; then
              IFS=: read -r qa_vsock_major qa_vsock_minor < "/sys/class/misc/$qa_vsock_node/dev"
              mknod -m 0600 "/dev/$qa_vsock_node" c "$qa_vsock_major" "$qa_vsock_minor"
            fi
          done
          test -c /dev/kvm
      - name: Exercise native CLI and API in disposable storage
        run: /opt/uranus-contract/bin/python scripts/incus_smoke.py --data-dir /tmp/uranus-incus-smoke-ci
      - name: Parse master and agent monitoring configuration
        run: /opt/uranus-contract/bin/python scripts/check_icinga.py
      - name: Parse IPv4 and IPv6 host and guest firewall configuration
        run: /opt/uranus-contract/bin/python scripts/check_firewall.py
      - name: Validate native key-only SSH for changing IPv4 and IPv6 sources
        run: /opt/uranus-contract/bin/python scripts/check_ssh.py
