---
app_env: development
dashboard_enabled: true
dashboard_domain: '{{ hetzner_domains.dev_dashboard }}'
documentation_enabled: true
documentation_domain: '{{ hetzner_domains.documentation }}'
documentation_dist: /opt/uranus/documentation/uranus-docs/dist
manual_enabled: true
manual_domain: '{{ hetzner_domains.manual }}'
manual_dist: /opt/uranus/documentation/kulturbytes-manual/dist
dashboard_repo_version: '6a1c296c700f16d05350b11d1b295f576031f8f5'
backend_auth_reset_password_url: 'https://{{ dashboard_domain }}/app/reset-password'
# The backend sends directly through this authenticated STARTTLS relay.
# Keep the provider password in the encrypted production vault.
backend_auth_smtp_host: smtp.porkbun.com
backend_auth_smtp_port: 587
backend_auth_smtp_login: hello@kulturbytes.de
backend_auth_smtp_password: '{{ vault_backend_smtp_password_dev }}'
backend_auth_reply_email_address: hello@kulturbytes.de
# Pin the dev branches to concrete commits for reproducible deployments.
frontend_repo_version: '359a6cd84afdead4212ae8040e41d969e050b5b9'
backend_repo_version: 'd06a615b4b4c8454f5298902fabcddd1d7985834'
db_host: '{{ hostvars[''db01''].ansible_host }}'
db_name: uranus_dev
db_user: uranus_dev
db_password: '{{ vault_db_password_dev }}'
