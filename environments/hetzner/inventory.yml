---
all:
  vars:
    ansible_ssh_extra_args: -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
  children:
    incus_hosts:
      hosts:
        hetzner:
          ansible_host: 94.130.236.38
          ansible_user: awendelk
    uranus_instances:
      vars:
        ansible_user: debian
        ansible_become: true
        ansible_ssh_common_args: -o ProxyJump=awendelk@94.130.236.38 -o StrictHostKeyChecking=yes
        # Use the target guest's name when tasks are delegated between guests.
        ansible_host: '{{ (incus_instances | selectattr(''name'', ''equalto'', inventory_hostname_short) | first).ip }}'
      hosts:
        db01: {}
        dev01: {}
        prod01: {}
        mon01: {}
        nom01: {}
        vers01: {}
        nginx01: {}
        plausible01: {}
